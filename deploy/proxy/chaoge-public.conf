# 超哥电竞 · Staging 公网只读预览（Nginx）
#
#   Internet :80  →  Nginx  →  127.0.0.1:3000 (Next.js, chaoge-staging)
#
# 这个文件由 `deploy/proxy/install-public-proxy.sh` 安装到
# `/etc/nginx/sites-available/chaoge-public.conf` 并启用。
#
# ## 安全模型
#
# 公网只读预览与私有 SSH 隧道访问**共用同一个 Next.js 进程**。本文件负责第一层
# 白名单，`proxy.ts` + `lib/config/publicPreview.ts` 负责第二层同样的白名单。
# 两层都必须失效，Mock 管理/客服/支付能力才会暴露。
#
# 所有放行的 proxy_pass 都在 server 级统一注入：
#   · X-Chaoge-Public-Preview: 1  → 应用据此进入只读模式
#   · Cookie: ""                  → 公网请求永远没有 Mock 会话身份
#   · Authorization: ""           → 不携带任何凭据
#
# ## 明确不做的事
#
#   · 不监听 3000 / 5432；
#   · 不修改 UFW、iptables 或腾讯云安全组（由人工授权后另行操作）；
#   · 不设置 Basic Auth（公网目标是匿名浏览；HTTP 明文口令反而更糟）；
#   · 不转发任何 /api/admin、/api/staff、/api/companion、/api/auth、/api/debug、
#     /api/payments、/api/orders 等私有接口——它们连 Nginx 都不会代理。

# http 级限流区（本文件被 include 在 http {} 内）
limit_req_zone $binary_remote_addr zone=chaoge_public_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=chaoge_public_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 不暴露版本号
    server_tokens off;

    # 公网只读：请求体极小；GET/HEAD 之外会在应用层被拒。
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    send_timeout 30s;

    # 基础限流：应对爬虫/误循环，不限制正常首屏并发。
    # 首屏一次会并发取十几个 JS/CSS，burst 60 足够；持续 20r/s 以上才排队。
    limit_req zone=chaoge_public_req burst=60 nodelay;
    limit_req_status 429;
    limit_conn zone=chaoge_public_conn 20;
    limit_conn_status 429;

    # 安全响应头。`always` 让 4xx/5xx 也带上。
    # 注意：如果某个 location 自己写了 add_header，会覆盖 server 级这一整组；
    # 下面所有 location 都刻意没有再写 add_header。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    access_log /var/log/nginx/chaoge-public.access.log;
    error_log  /var/log/nginx/chaoge-public.error.log warn;

    # ── 反代公共设置（server 级，所有 location 继承）────────────────────────
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚠️ 安全边界：应用据此进入只读模式，并清掉所有会话身份。
    proxy_set_header X-Chaoge-Public-Preview "1";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header X-Powered-By;

    # ── 公开页面（精确路径；允许尾斜杠）───────────────────────────────────
    location = / {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/(category|rank|rank/companions|companions|agreements|activities|help|placeholder)/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    # ── 公开详情页（前缀）───────────────────────────────────────────────
    # 只放行这两棵子树；页面自己处理不存在/已下架。
    location ^~ /product/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /companions/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # ── 公开只读接口（精确路径）──────────────────────────────────────────
    location = /api/home {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/catalog/products {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/companions {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/agreements {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/rankings/consumption {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/rankings/companions {
        proxy_pass http://127.0.0.1:3000;
    }

    # 其余 API 一律「不存在」：包括 admin / staff / companion / auth / debug /
    # payments / orders / me / favorites / coupons / refunds / complaints。
    location /api/ {
        return 404;
    }

    # ── 静态资源 ─────────────────────────────────────────────────────────
    # 由 Next 进程返回（release 目录是 root:chaoge 0750，Nginx worker 不直接读）。
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }

    # 保留给部署健康检查使用；是无害的静态 SVG。
    location = /next.svg {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1y;
    }

    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }

    location ^~ /mock/ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }

    # ── 其它一切：404 ────────────────────────────────────────────────────
    # 这是白名单的兜底。任何忘记登记的页面/接口都会停在这里，
    # 而不是落到 Next.js 的完整路由表上。
    location / {
        return 404;
    }
}
